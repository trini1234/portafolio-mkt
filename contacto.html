<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinidad - Portafolio &amp; Tarjeta de Presentación</title>
    <!-- Vinculación del archivo CSS externo -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Tipografía Google Fonts (Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>

<body>

    <!-- CONTENEDOR CENTRAL (TARJETA) -->
    <main class="card card-contact">

        <!-- 1. Menú de navegación superior -->
        <nav class="nav">
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">Inicio</a></li>
                <li><a href="proyectos.html" class="nav-link">Proyectos</a></li>
                <li><a href="contacto.html" class="nav-link active">Contacto</a></li>
            </ul>
        </nav>

        <div class="contact-container">
            <h2>Contacto</h2>
            <p>¡Escríbeme un mensaje y nos pondremos en contacto a la brevedad!</p>

            <form action="#" method="POST" class="contact-form">
                <div class="form-group" data-aos="fade-up">
                    <label for="username">Nombre Completo: </label>
                    <input type="text" id="username" name="username" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="form-group" data-aos="fade-up">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group" data-aos="fade-up">
                    <label for="message">Mensaje:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Escribe tu mensaje aquí..."
                        required></textarea>
                </div>

                <button type="submit" class="btn-submit">Enviar Mensaje</button>
            </form>
        </div>

    </main>


    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>

</html>
